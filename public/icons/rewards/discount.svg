<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="discountGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#discountGradient)" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- Price tag -->
  <path d="M20 20 L44 20 L48 24 L44 28 L20 28 Z" fill="url(#tagGradient)" stroke="#B71C1C" stroke-width="2"/>
  
  <!-- Tag hole -->
  <circle cx="20" cy="24" r="2" fill="#FFEBEE"/>
  
  <!-- Percentage symbol -->
  <text x="32" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">%</text>
  
  <!-- Dollar sign -->
  <text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">$</text>
  
  <!-- Discount lines -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="#FFD700" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="48" y1="16" x2="16" y2="48" stroke="#FFD700" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Discount Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32" text-anchor="middle">DISCOUNT</text>
  
  <!-- Small coins around -->
  <circle cx="16" cy="16" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="16" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="16" cy="48" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="48" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
</svg>
