<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recognitionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#recognitionGradient)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Trophy base -->
  <rect x="24" y="40" width="16" height="6" rx="2" fill="#8B4513"/>
  
  <!-- Trophy handles -->
  <path d="M20 28 Q16 24 20 20" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M44 28 Q48 24 44 20" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Trophy cup -->
  <path d="M20 20 L28 12 L36 12 L44 20 L44 28 L20 28 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Star on trophy -->
  <path d="M32 16 L33.5 20 L38 20 L34.5 22.5 L36 27 L32 24.5 L28 27 L29.5 22.5 L26 20 L30.5 20 Z" fill="#FF6B6B"/>
  
  <!-- Recognition Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#8B4513" text-anchor="middle">RECOGNITION</text>
  
  <!-- Sparkles -->
  <circle cx="16" cy="16" r="2" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="48" cy="16" r="1.5" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="12" cy="32" r="1" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="52" cy="32" r="1.5" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="16" cy="48" r="1" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="2" fill="#FFD700" filter="url(#glow)"/>
</svg>
