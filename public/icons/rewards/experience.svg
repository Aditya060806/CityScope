<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="experienceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673AB7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ticketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E1BEE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CE93D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#experienceGradient)" stroke="#4A148C" stroke-width="2"/>
  
  <!-- Event ticket -->
  <rect x="16" y="20" width="32" height="24" rx="4" fill="url(#ticketGradient)" stroke="#7B1FA2" stroke-width="2"/>
  
  <!-- Ticket perforations -->
  <circle cx="32" cy="20" r="2" fill="#9C27B0"/>
  <circle cx="32" cy="44" r="2" fill="#9C27B0"/>
  
  <!-- Event icon (calendar) -->
  <rect x="22" y="26" width="20" height="12" rx="2" fill="#7B1FA2"/>
  <rect x="22" y="26" width="20" height="4" fill="#4A148C"/>
  <circle cx="26" cy="28" r="1" fill="white"/>
  <circle cx="30" cy="28" r="1" fill="white"/>
  <circle cx="34" cy="28" r="1" fill="white"/>
  <circle cx="38" cy="28" r="1" fill="white"/>
  
  <!-- Date lines -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="white" stroke-width="1"/>
  <line x1="24" y1="34" x2="40" y2="34" stroke="white" stroke-width="1"/>
  
  <!-- Magic sparkles -->
  <path d="M12 12 L14 8 L16 12 L14 16 Z" fill="#FFD700"/>
  <path d="M48 12 L50 8 L52 12 L50 16 Z" fill="#FFD700"/>
  <path d="M12 48 L14 44 L16 48 L14 52 Z" fill="#FFD700"/>
  <path d="M48 48 L50 44 L52 48 L50 52 Z" fill="#FFD700"/>
  
  <!-- Star burst -->
  <path d="M32 8 L34 12 L38 12 L35 15 L37 19 L32 16 L27 19 L29 15 L26 12 L30 12 Z" fill="#FFD700"/>
  
  <!-- Experience Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#673AB7" text-anchor="middle">EXPERIENCE</text>
</svg>
