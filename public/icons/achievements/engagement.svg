<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="engagementGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E1BEE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CE93D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#engagementGradient)" stroke="#4A148C" stroke-width="2"/>
  
  <!-- Chat bubble -->
  <path d="M20 20 L44 20 L44 32 L36 32 L32 36 L28 32 L20 32 Z" fill="url(#chatGradient)" stroke="#6A1B9A" stroke-width="2"/>
  
  <!-- Chat tail -->
  <path d="M28 32 L24 36 L28 40 Z" fill="url(#chatGradient)" stroke="#6A1B9A" stroke-width="2"/>
  
  <!-- Message lines -->
  <line x1="24" y1="24" x2="40" y2="24" stroke="#4A148C" stroke-width="2"/>
  <line x1="24" y1="28" x2="36" y2="28" stroke="#4A148C" stroke-width="2"/>
  
  <!-- Engagement indicators -->
  <circle cx="16" cy="16" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="16" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="16" cy="48" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="48" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  
  <!-- Connection lines -->
  <line x1="19" y1="19" x2="24" y2="24" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="45" y1="19" x2="40" y2="24" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="19" y1="45" x2="24" y2="40" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="45" y1="45" x2="40" y2="40" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Engagement Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#7B1FA2" text-anchor="middle">ENGAGEMENT</text>
</svg>
