<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="localGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#795548;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BCAAA4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A1887F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#localGradient)" stroke="#3E2723" stroke-width="2"/>
  
  <!-- Local buildings -->
  <rect x="20" y="24" width="6" height="16" fill="url(#buildingGradient)" stroke="#5D4037" stroke-width="1"/>
  <rect x="28" y="20" width="6" height="20" fill="url(#buildingGradient)" stroke="#5D4037" stroke-width="1"/>
  <rect x="36" y="26" width="6" height="14" fill="url(#buildingGradient)" stroke="#5D4037" stroke-width="1"/>
  
  <!-- Building windows -->
  <rect x="22" y="26" width="2" height="2" fill="#FFD700"/>
  <rect x="22" y="30" width="2" height="2" fill="#FFD700"/>
  <rect x="22" y="34" width="2" height="2" fill="#FFD700"/>
  
  <rect x="30" y="22" width="2" height="2" fill="#FFD700"/>
  <rect x="30" y="26" width="2" height="2" fill="#FFD700"/>
  <rect x="30" y="30" width="2" height="2" fill="#FFD700"/>
  <rect x="30" y="34" width="2" height="2" fill="#FFD700"/>
  
  <rect x="38" y="28" width="2" height="2" fill="#FFD700"/>
  <rect x="38" y="32" width="2" height="2" fill="#FFD700"/>
  <rect x="38" y="36" width="2" height="2" fill="#FFD700"/>
  
  <!-- Local landmark (flag) -->
  <rect x="32" y="16" width="2" height="8" fill="#8D6E63"/>
  <path d="M34 16 L40 18 L40 22 L34 20 Z" fill="#FF5722" stroke="#D84315" stroke-width="1"/>
  
  <!-- Community heart -->
  <path d="M16 20 C14 18, 10 18, 10 22 C10 26, 14 30, 16 32 C18 30, 22 26, 22 22 C22 18, 18 18, 16 20 Z" fill="#E91E63" stroke="#C2185B" stroke-width="1"/>
  
  <!-- Local connection lines -->
  <line x1="16" y1="32" x2="20" y2="32" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="26" y1="32" x2="28" y2="32" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="36" y1="32" x2="44" y2="32" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Local Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#5D4037" text-anchor="middle">LOCAL</text>
</svg>
