<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadershipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFECB3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#leadershipGradient)" stroke="#E65100" stroke-width="2"/>
  
  <!-- Crown -->
  <path d="M16 24 L20 20 L24 24 L28 20 L32 24 L36 20 L40 24 L44 20 L48 24 L48 28 L16 28 Z" fill="url(#crownGradient)" stroke="#F57F17" stroke-width="2"/>
  
  <!-- Crown jewels -->
  <circle cx="20" cy="22" r="2" fill="#FF5722"/>
  <circle cx="28" cy="22" r="2" fill="#2196F3"/>
  <circle cx="36" cy="22" r="2" fill="#4CAF50"/>
  <circle cx="44" cy="22" r="2" fill="#9C27B0"/>
  
  <!-- Leadership scepter -->
  <rect x="46" y="16" width="2" height="16" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>
  <circle cx="47" cy="16" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="47" cy="16" r="1.5" fill="#FF5722"/>
  
  <!-- Followers/community -->
  <circle cx="16" cy="40" r="3" fill="#FFAB91" stroke="#D84315" stroke-width="1"/>
  <circle cx="24" cy="40" r="3" fill="#FFCDD2" stroke="#D84315" stroke-width="1"/>
  <circle cx="40" cy="40" r="3" fill="#F8BBD9" stroke="#D84315" stroke-width="1"/>
  <circle cx="48" cy="40" r="3" fill="#E1BEE7" stroke="#D84315" stroke-width="1"/>
  
  <!-- Leadership rays -->
  <line x1="32" y1="8" x2="32" y2="16" stroke="#FFD700" stroke-width="3"/>
  <line x1="20" y1="12" x2="24" y2="16" stroke="#FFD700" stroke-width="2"/>
  <line x1="44" y1="12" x2="40" y2="16" stroke="#FFD700" stroke-width="2"/>
  <line x1="8" y1="20" x2="16" y2="24" stroke="#FFD700" stroke-width="2"/>
  <line x1="56" y1="20" x2="48" y2="24" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Leadership Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FF8F00" text-anchor="middle">LEADERSHIP</text>
</svg>
