<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="milestoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#milestoneGradient)" stroke="#E65100" stroke-width="2"/>
  
  <!-- Flag pole -->
  <rect x="30" y="16" width="4" height="32" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>
  
  <!-- Flag -->
  <path d="M34 16 L48 20 L48 28 L34 24 Z" fill="url(#flagGradient)" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- Flag details -->
  <line x1="36" y1="18" x2="46" y2="22" stroke="white" stroke-width="1"/>
  <line x1="36" y1="20" x2="46" y2="24" stroke="white" stroke-width="1"/>
  
  <!-- Milestone marker -->
  <rect x="26" y="40" width="12" height="8" rx="2" fill="#FFD700" stroke="#F57F17" stroke-width="2"/>
  <text x="32" y="46" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#E65100" text-anchor="middle">1</text>
  
  <!-- Progress dots -->
  <circle cx="16" cy="24" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="24" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="16" cy="40" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  <circle cx="48" cy="40" r="3" fill="#FFD700" stroke="#F57F17" stroke-width="1"/>
  
  <!-- Milestone Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#F7931E" text-anchor="middle">MILESTONE</text>
</svg>
