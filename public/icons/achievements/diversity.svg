<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diversityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D84315;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="16.66%" style="stop-color:#FF7F00;stop-opacity:1" />
      <stop offset="33.33%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="66.66%" style="stop-color:#0000FF;stop-opacity:1" />
      <stop offset="83.33%" style="stop-color:#4B0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9400D3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#diversityGradient)" stroke="#BF360C" stroke-width="2"/>
  
  <!-- Rainbow arc -->
  <path d="M16 40 Q32 20 48 40" stroke="url(#rainbowGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Diversity symbols -->
  <!-- People icons -->
  <circle cx="20" cy="44" r="3" fill="#FFAB91" stroke="#D84315" stroke-width="1"/>
  <circle cx="28" cy="44" r="3" fill="#FFCDD2" stroke="#D84315" stroke-width="1"/>
  <circle cx="36" cy="44" r="3" fill="#F8BBD9" stroke="#D84315" stroke-width="1"/>
  <circle cx="44" cy="44" r="3" fill="#E1BEE7" stroke="#D84315" stroke-width="1"/>
  
  <!-- Connection lines -->
  <line x1="20" y1="44" x2="28" y2="44" stroke="#FFD700" stroke-width="1"/>
  <line x1="28" y1="44" x2="36" y2="44" stroke="#FFD700" stroke-width="1"/>
  <line x1="36" y1="44" x2="44" y2="44" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Diversity indicators -->
  <circle cx="16" cy="16" r="2" fill="#FF0000"/>
  <circle cx="48" cy="16" r="2" fill="#00FF00"/>
  <circle cx="16" cy="48" r="2" fill="#0000FF"/>
  <circle cx="48" cy="48" r="2" fill="#FFD700"/>
  
  <!-- Unity symbol -->
  <circle cx="32" cy="32" r="4" fill="#FFD700" stroke="#F57F17" stroke-width="2"/>
  <text x="32" y="35" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#D84315" text-anchor="middle">∞</text>
  
  <!-- Diversity Text -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#D84315" text-anchor="middle">DIVERSITY</text>
</svg>
